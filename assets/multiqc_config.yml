report_comment: >
  This report has been generated by the
  <a href="https://github.com/seqeralabs/rustqc-benchmarks" target="_blank">seqeralabs/rustqc-benchmarks</a>
  analysis pipeline.

export_plots: true
disable_version_detection: true

run_modules:
  - custom_content
  - rseqc
  - samtools
  - preseq
  - qualimap
  - dupradar
  - subread_featurecounts

module_order:
  # RustQC sections (only match files under */rustqc/*)
  - rseqc:
      name: "RSeQC (RustQC)"
      anchor: "rseqc_rustqc"
      path_filters:
        - "*/rustqc/*"
  - samtools:
      name: "Samtools (RustQC)"
      anchor: "samtools_rustqc"
      path_filters:
        - "*/rustqc/*"
  - preseq:
      name: "Preseq (RustQC)"
      anchor: "preseq_rustqc"
      path_filters:
        - "*/rustqc/*"
  - qualimap:
      name: "QualiMap (RustQC)"
      anchor: "qualimap_rustqc"
      path_filters:
        - "*/rustqc/*"
  - dupradar:
      name: "dupRadar (RustQC)"
      anchor: "dupradar_rustqc"
      path_filters:
        - "*/rustqc/*"
  - subread_featurecounts:
      name: "featureCounts (RustQC)"
      anchor: "featurecounts_rustqc"
      path_filters:
        - "*/rustqc/*"

  # Upstream sections (exclude anything under */rustqc/*)
  - rseqc:
      name: "RSeQC (upstream)"
      anchor: "rseqc_upstream"
      path_filters_exclude:
        - "*/rustqc/*"
  - samtools:
      name: "Samtools (upstream)"
      anchor: "samtools_upstream"
      path_filters_exclude:
        - "*/rustqc/*"
  - preseq:
      name: "Preseq (upstream)"
      anchor: "preseq_upstream"
      path_filters_exclude:
        - "*/rustqc/*"
  - qualimap:
      name: "QualiMap (upstream)"
      anchor: "qualimap_upstream"
      path_filters_exclude:
        - "*/rustqc/*"
  - dupradar:
      name: "dupRadar (upstream)"
      anchor: "dupradar_upstream"
      path_filters_exclude:
        - "*/rustqc/*"
  - subread_featurecounts:
      name: "featureCounts (upstream)"
      anchor: "featurecounts_upstream"
      path_filters_exclude:
        - "*/rustqc/*"

report_section_order:
  rseqc_rustqc:
    before: rseqc_upstream
  samtools_rustqc:
    before: samtools_upstream
  preseq_rustqc:
    before: preseq_upstream
  qualimap_rustqc:
    before: qualimap_upstream
  dupradar_rustqc:
    before: dupradar_upstream
  featurecounts_rustqc:
    before: featurecounts_upstream
