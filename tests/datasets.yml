    set: large
    description: >-
      Human GRCh37 chrX (`X`, full length), paired-end 2x75, unstranded (GEUVADIS ERR188383),
      STAR 2.7.10a. 100,826 records (2,094 secondary), not duplicate-marked. Full Ensembl chrX
      annotation (transcript and exon records, no gene records). From the nf-core rnasplice
      test data.
    inputs:
      bam:
        url: "{nfcore_rnasplice}/testdata/ERR188383.Aligned.out.bam"
        md5: b0f87a0f7490de44b23c8fb7e2400297
      bai:
        url: "{nfcore_rnasplice}/testdata/ERR188383.Aligned.out.bam.bai"
        md5: 710b133442903288f0e0614dea57d056
      gtf:
        url: "{nfcore_rnasplice}/reference/genes_chrX.gtf"
