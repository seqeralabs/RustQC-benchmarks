    inputs:
      bam:
        url: "{nfcore_modules}/genomics/eukaryotes/saccharomyces_cerevisiae/illumina/bam/test.single_end.sorted.bam"
        md5: 8effceb3f2dacbbcbe9c468e6e5b1130
      bai:
        url: "{nfcore_modules}/genomics/eukaryotes/saccharomyces_cerevisiae/illumina/bam/test.single_end.sorted.bam.bai"
        md5: 80eabc904d193e5215f9041ba9267ba6
      gtf:
        url: "{nfcore_modules}/genomics/eukaryotes/saccharomyces_cerevisiae/genome_gfp.gtf"
        md5: c98b12c302f15731bfc36bcf297cfe28
    meta:
