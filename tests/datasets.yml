  - id: hs_ribo_chr19_22_se_fwd
    description: >-
      Human GRCh38 (Ensembl names, 194 @SQ lines) Ribo-seq, single-end 20-42 nt,
      forward-stranded (GSE182201 SRX11780885), STAR, reads on 19 and 22 only, filtered to
      protein-coding loci and downsampled to 82,655 records. Ensembl 111 protein-coding
      annotation of chr19 + chr22. From the nf-core gedi/price module test data.
    inputs:
      bam:
        url: "{nfcore_modules}/genomics/homo_sapiens/riboseq_expression/price/bams/SRX11780885.chr19_22.ds50.bam"
        md5: 58adf889c3f768c1be1de0084464f724
      bai:
        url: "{nfcore_modules}/genomics/homo_sapiens/riboseq_expression/price/bams/SRX11780885.chr19_22.ds50.bam.bai"
        md5: 75f89c62821e9a620572fab98751c5fd
      gtf:
        url: "{nfcore_modules}/genomics/homo_sapiens/riboseq_expression/price/Homo_sapiens.GRCh38.111_chr19_22.pc.gtf.gz"
        md5: 45e31f7ff74b62dd60a51056623eeca1
    meta:
