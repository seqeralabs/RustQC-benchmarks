repository_type: pipeline

nf_core_version: 4.2.2

lint:
  files_unchanged:
    - .prettierignore
    - docs/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-rustqc-benchmarks_logo_light.png
    - docs/images/nf-core-rustqc-benchmarks_logo_light.png
    - docs/images/nf-core-rustqc-benchmarks_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    # Actions pinned to commit SHAs; PR comments go through pr-comment.yml
    - .github/workflows/linting.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - process.cpus
    - process.memory
    - process.time
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    # Inputs are --bam/--gtf, not a samplesheet
    - params.input
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - assets/multiqc_config.yml
    - CITATIONS.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-rustqc-benchmarks_logo_light.png
    - docs/images/nf-core-rustqc-benchmarks_logo_light.png
    - docs/images/nf-core-rustqc-benchmarks_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/branch.yml
    - conf/igenomes.config
    # Replaced by the shared pr-comment.yml poster (current template design)
    - .github/workflows/linting_comment.yml
    # Documentation lives in README.md
    - .github/CONTRIBUTING.md
    - docs/README.md
    - docs/output.md
    - docs/usage.md
  included_configs: false
  # Binary BAM whose bytes happen to contain '{{' / '{%'
  template_strings:
    - test-data/rna/small/test.name_sorted.bam
  # Qualimap's rnaseq_qc_results.txt uses 7-character '>' section headers, not merge markers
  merge_markers:
    - snapshots/rna/small/qualimap/rnaseq_qc_results.txt
    - snapshots/rna/small/rustqc/qualimap/rnaseq_qc_results.txt

template:
  org: seqeralabs
  name: rustqc-benchmarks
  description: Benchmark suite for validating RustQC outputs against upstream bioinformatics
    tools
  author: Phil Ewels
  version: 1.0.0
  force: true
  outdir: /tmp/rustqc-benchmarks-scaffold
  skip_features:
    - igenomes
    - fastqc
    - multiqc
    - slackreport
    - adaptivecard
    - email
    - nf_core_configs
    - citations
    - codespaces
    - rocrate
  is_nfcore: false
